name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npx nx lint web

      - name: Typecheck
        run: npx nx typecheck web

      - name: Test
        run: npx nx test web --run

      - name: Build
        run: npx nx build web
