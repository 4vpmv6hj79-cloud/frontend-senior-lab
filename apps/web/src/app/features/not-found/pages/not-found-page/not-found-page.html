<main
  class="relative flex min-h-screen items-center justify-center overflow-hidden bg-slate-950 text-white"
>
  <!-- Background decorations -->
  <div
    class="pointer-events-none absolute inset-x-0 top-0 h-96 bg-gradient-to-b from-cyan-500/10 to-transparent"
    aria-hidden="true"
  ></div>

  <div
    class="pointer-events-none absolute -left-40 top-1/3 h-96 w-96 rounded-full bg-rose-500/10 blur-3xl"
    aria-hidden="true"
  ></div>

  <div
    class="pointer-events-none absolute -right-40 bottom-1/4 h-96 w-96 rounded-full bg-indigo-500/10 blur-3xl"
    aria-hidden="true"
  ></div>

  <!-- Language switcher (top-right) -->
  <div class="absolute right-5 top-5 sm:right-8 sm:top-8">
    <app-language-switcher />
  </div>

  <!-- Content -->
  <div class="relative mx-auto max-w-2xl px-5 text-center">
    <p
      class="text-[8rem] font-black leading-none tracking-tight text-slate-800 sm:text-[12rem]"
      aria-hidden="true"
    >
      {{ copy().code }}
    </p>

    <div class="-mt-10 sm:-mt-14">
      <div
        class="mx-auto mb-6 grid size-16 place-items-center rounded-2xl border border-rose-400/20 bg-rose-400/10 text-3xl text-rose-300"
        aria-hidden="true"
      >
        ✕
      </div>

      <h1 class="text-3xl font-black tracking-tight sm:text-4xl">
        {{ copy().title }}
      </h1>

      <p
        class="mx-auto mt-5 max-w-lg text-base leading-7 text-slate-400"
      >
        {{ copy().description }}
      </p>

      <p class="mx-auto mt-3 max-w-lg text-sm text-slate-500">
        {{ copy().suggestion }}
      </p>

      <div class="mt-10 flex flex-col items-center justify-center gap-4 sm:flex-row">
        <a
          routerLink="/"
          class="inline-flex items-center justify-center rounded-xl bg-cyan-400 px-6 py-3 text-sm font-black text-slate-950 transition hover:-translate-y-0.5 hover:bg-cyan-300 focus:outline-none focus:ring-2 focus:ring-cyan-300 focus:ring-offset-2 focus:ring-offset-slate-950"
        >
          <span class="mr-2" aria-hidden="true">←</span>
          {{ copy().backHome }}
        </a>

        <a
          routerLink="/dashboard"
          class="inline-flex items-center justify-center rounded-xl border border-white/15 bg-white/5 px-6 py-3 text-sm font-bold text-white transition hover:border-cyan-400/60 hover:bg-cyan-400/10"
        >
          {{ copy().goToDashboard }}
        </a>
      </div>
    </div>
  </div>
</main>
